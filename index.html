<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7fafc" />
  <title>TAP test - Evaluation mobile</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="brand-band" aria-label="En-tete TAP test">
      <div class="logo-slot" aria-label="Emplacement logo CHU">
        <span>Logo CHU</span>
      </div>
      <div class="brand-title">
        <p class="eyebrow">Protocole pratique</p>
        <h1>TAP test</h1>
        <p>TUG + marche 6 m, avant et apres ponction depletive.</p>
      </div>
      <a class="qr-slot" href="./assets/qr-contact.jpg" aria-label="QR code de contact">
        <img src="./assets/qr-contact.jpg" alt="QR code de contact CHU" />
      </a>
    </header>

    <section class="identity-band" aria-labelledby="identity-title">
      <div>
        <h2 id="identity-title">Identification anonymisee</h2>
        <p>Utiliser un signe libre non nominatif.</p>
      </div>
      <label class="field compact-field">
        <span>Code</span>
        <input id="participant-id" type="text" inputmode="text" autocomplete="off" placeholder="ex. TAP-042" />
      </label>
      <button id="reset-all" class="reset-all" type="button">Tout reinitialiser</button>
    </section>

    <section class="entry-panel" id="entry-panel">
      <div class="timepoint-strip" role="group" aria-label="Temps de mesure">
        <button class="timepoint-button is-active" type="button" data-timepoint="before">Avant TAP</button>
        <button class="timepoint-button" type="button" data-timepoint="h2">2-4 h</button>
        <button class="timepoint-button" type="button" data-timepoint="h24">24 h</button>
        <button class="timepoint-button" type="button" data-timepoint="h48">48 h</button>
      </div>

      <div class="protocol-note">
        <strong id="current-timepoint-label">Avant TAP</strong>
        <span>Renseigner le temps, puis le nombre de pas pour les marches de 6 m. La vitesse est calculee automatiquement.</span>
      </div>

      <div id="measure-list" class="measure-list"></div>

      <label class="field final-notes">
        <span>Suggestions de notes</span>
        <textarea id="qualitative-notes" rows="5" placeholder="Conditions d'examen, aide technique, chaussage utilise, elements qualitatifs utiles..."></textarea>
      </label>

      <div class="action-row">
        <button id="share-results" class="primary-action" type="button">Partager</button>
        <button id="mail-results" class="secondary-action" type="button">Mail</button>
        <button id="copy-results" class="secondary-action" type="button">Copier</button>
      </div>
    </section>
  </main>

  <script src="./app.js?v=20260422-compat-reset"></script>
</body>
</html>
